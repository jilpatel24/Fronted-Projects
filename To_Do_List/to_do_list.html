<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/calender.css">
</head>
<body>
    <div class="container">
        <aside>
            <div class="logo"></div>
            <div class="nav"></div>
            <div class="calender">
              <div class="cel_header">
                <span><button id="prev">></button></span>
                <h3 class="monthName" id="monthName"></h3>
                <span><button id="next"><</button></span>
              </div>
             <div class="calender_header">
               <div class="weekdays">
                 <span>Sun</span>
                 <span>Mon</span>
                 <span>Tue</span>
                 <span>Wed</span>
                 <span>Thu</span>
                 <span>Fri</span>
                 <span>Sat</span>
               </div> 
             </div>
             <div class="dates" id="dates"></div>
          </div>
            <div class="schedule">
                <h3>My Calender</h3>
               <label><input type="checkbox">Birthday</label>
               <label><input type="checkbox">Tasks</label>
               <label><input type="checkbox">Reminder</label>
               <label><input type="checkbox">Progress</label>
                <label><input type="checkbox">College</label>
            </div>
            <div class="category"></div>
        </aside>
        <main>
            <header>
                <input type="text">
                <button class="button"></button>
                <div class="notification"></div>
                <div class="profile"></div>
            </header>
            <!--card Describing Events for To_Do_List -->
            <section class="stats">
                <div class="card"></div>
                <div class="card"></div>
                <div class="card"></div>
            </section>
            <section class="events"></section>
        </main>
    </div>
  <script src="JS/calender.js"></script>  
</body>
</html>
